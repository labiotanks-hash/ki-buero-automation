[project]
name = "mail-agent-mcp"
version = "1.0.0"
description = "MCP-Server für ein Postfach: lesen, sortieren mit Vorschau und Freigabe, Aufgaben herausziehen, Entwürfe anlegen. Senden und Löschen gibt es nicht."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 1.x: FastMCP liegt unter mcp.server.fastmcp
    "mcp>=1.10,<2",
]

[project.optional-dependencies]
# Nur für das echte Outlook-Backend. Die Demo braucht das nicht.
graph = ["msal>=1.28", "requests>=2.31"]

[project.scripts]
mail-agent-mcp = "mail_agent.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mail_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
